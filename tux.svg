<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 250" role="img" aria-labelledby="title">
  <title id="title">Tux, the Linux penguin</title>
  <defs>
    <linearGradient id="black" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#303744"/>
      <stop offset=".55" stop-color="#171b24"/>
      <stop offset="1" stop-color="#080b11"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e4e8ee"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffd84a"/>
      <stop offset="1" stop-color="#f28b16"/>
    </linearGradient>
  </defs>
  <!-- Feet -->
  <path d="M72 210c-23 5-39 17-37 27 2 9 25 10 48 5 12-2 20-7 22-14 1-8-13-21-33-18zm76 0c23 5 39 17 37 27-2 9-25 10-48 5-12-2-20-7-22-14-1-8 13-21 33-18z" fill="url(#orange)" stroke="#9d4b0b" stroke-width="3"/>
  <!-- Flippers -->
  <path d="M62 112C42 117 25 141 19 169c-4 18 1 31 12 33 10 2 19-8 28-21l27-43zm96 0c20 5 37 29 43 57 4 18-1 31-12 33-10 2-19-8-28-21l-27-43z" fill="url(#black)" stroke="#090b10" stroke-width="5" stroke-linejoin="round"/>
  <!-- Body and head -->
  <path d="M110 14C65 14 39 48 39 99v66c0 47 27 76 71 76s71-29 71-76V99c0-51-26-85-71-85z" fill="url(#black)"/>
  <!-- White face mask -->
  <path d="M61 67c0-23 17-39 37-35 7 2 11 8 12 15 1-7 5-13 12-15 20-4 37 12 37 35 0 23-15 39-37 42-5 1-9-2-12-7-3 5-7 8-12 7-22-3-37-19-37-42z" fill="url(#white)"/>
  <!-- Eyes -->
  <ellipse cx="88" cy="69" rx="5" ry="8" fill="#16191f"/>
  <ellipse cx="132" cy="69" rx="5" ry="8" fill="#16191f"/>
  <circle cx="90" cy="66" r="1.6" fill="#fff"/>
  <circle cx="134" cy="66" r="1.6" fill="#fff"/>
  <!-- Beak -->
  <path d="m110 81-17 15c-3 3-1 8 4 8h26c5 0 7-5 4-8z" fill="url(#orange)" stroke="#a8510b" stroke-width="3" stroke-linejoin="round"/>
  <!-- Belly -->
  <path d="M110 111c-32 0-49 26-49 63 0 36 18 58 49 58s49-22 49-58c0-37-17-63-49-63z" fill="url(#white)"/>
</svg>
